name: Docker Publish

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-client-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate self-hosted client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install client dependencies
        run: pnpm --filter client... install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @rybbit/shared build
      - name: Lint client
        run: pnpm --filter client lint
      - name: Type-check client
        run: pnpm --filter client typecheck
      - name: Test client
        run: pnpm --filter client test:run --maxWorkers=4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=
            NEXT_PUBLIC_DISABLE_SIGNUP=true
            NEXT_PUBLIC_CLOUD=false
            NEXT_PUBLIC_DEPLOYMENT=selfhost
            NEXT_PUBLIC_LITE_DASHBOARD=false
            NEXT_PUBLIC_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          cache-from: type=gha,scope=selfhost-client
          cache-to: type=gha,mode=max,scope=selfhost-client

  build:
    name: Build client (${{ matrix.arch }})
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/rybbit-client" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=selfhost
            type=sha,format=long,prefix=sha-
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=
            NEXT_PUBLIC_DISABLE_SIGNUP=true
            NEXT_PUBLIC_CLOUD=false
            NEXT_PUBLIC_DEPLOYMENT=selfhost
            NEXT_PUBLIC_LITE_DASHBOARD=false
            NEXT_PUBLIC_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          cache-from: |
            type=gha,scope=selfhost-client-${{ matrix.arch }}
            type=gha,scope=selfhost-client
          cache-to: type=gha,mode=max,scope=selfhost-client-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: client-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish self-hosted client
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: client-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Select image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/rybbit-client" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=selfhost
            type=sha,format=long,prefix=sha-
      - name: Create multi-platform manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$TAGS_JSON")
          images=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            images+=("$IMAGE@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
      - name: Verify published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker buildx imagetools inspect "$IMAGE:selfhost"
