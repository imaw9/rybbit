name: Publish OAuth information

on:
  push:
    branches: [master]
    paths:
      - "ops/oauth-info/**"
      - ".github/workflows/oauth-info.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-info-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ops/oauth-info
      - uses: actions/deploy-pages@v4
        id: deployment
